services:
  mysql:
    image: mysql:8.0
    container_name: cdc-mysql
    restart: unless-stopped

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cdc_db
      
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cdc-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: cdc-kafka
    restart: unless-stopped

    ports:
      - "19092:19092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

    networks:
      - cdc-network


  kafka-connect:
    image: debezium/connect:2.4.1.Final
    container_name: cdc-connect
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_healthy

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_REST_PORT: 8083

      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8083/connectors || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - cdc-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: cdc-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - cdc-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    container_name: cdc-kibana
    restart: unless-stopped

    depends_on:
      elasticsearch:
        condition: service_healthy

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    networks:
      - cdc-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc-kafka-ui
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

    networks:
      - cdc-network

  django:
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile.django
    container_name: cdc-django
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    environment:
      DEBUG: "True"
      SECRET_KEY: django-secret-key-change-me-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,django
      
      DB_NAME: cdc_db
      DB_USER: root
      DB_PASSWORD: ""
      DB_HOST: mysql
      DB_PORT: "3306"

      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: products

    ports:
      - "8000:8000"

    volumes:
      - ../..:/app

    command: python manage.py runserver 0.0.0.0:8000

    networks:
      - cdc-network

  kafka-consumer:
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile.consumer
    container_name: cdc-consumer
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: cdc-consumer-group-v2

      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: products

      DEV_MODE: "true"

    volumes:
      - ../..:/app

    command: python -m consumers.kafka_consumer.main

    networks:
      - cdc-network

volumes:
  mysql_data:
  elasticsearch_data:

networks:
  cdc-network:
    driver: bridge